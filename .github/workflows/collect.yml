name: Collect ECMWF

on:
  workflow_dispatch:
    inputs:
      days:
        description: Forecast horizon in days (1-15)
        required: true
        default: '15'
      cycle:
        description: Initialization cycle (auto, 0, 6, 12, 18)
        type: choice
        options: ['auto', '0', '6', '12', '18']
        default: 'auto'
      source:
        description: ECMWF public source
        type: choice
        options: ['ecmwf', 'aws', 'azure', 'google']
        default: 'ecmwf'

permissions:
  contents: read
  actions: read

# Prevent two collectors from restoring the same DB and overwriting each other's history.
concurrency:
  group: ecmwf-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore the most recent saved database
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ecmwf-tdd-data&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty')
          if [ -n "$artifact_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/previous-db.zip"
            python -m zipfile -e "$RUNNER_TEMP/previous-db.zip" data
            test -f data/weather.sqlite
          else
            echo "No unexpired database artifact. Starting a new history."
          fi
      - name: Download, save and calculate
        env:
          FORECAST_DAYS: ${{ inputs.days }}
          FORECAST_CYCLE: ${{ inputs.cycle }}
          ECMWF_SOURCE: ${{ inputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          args=(collect --days "$FORECAST_DAYS" --source "$ECMWF_SOURCE")
          if [ "$FORECAST_CYCLE" != auto ]; then
            args+=(--cycle "$FORECAST_CYCLE")
          fi
          python ecmwf_tdd.py "${args[@]}"
      - name: Save SQLite and CSV
        uses: actions/upload-artifact@v7
        with:
          name: ecmwf-tdd-data
          path: |
            data/weather.sqlite
            data/export/
          if-no-files-found: error
          retention-days: 90
